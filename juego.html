<html lang="es">

      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="assets/images/jtm.ico" type="image/x-icon" />
    <link rel="canonical" href="https://josephmansilla.github.io/juego.html" />
    <meta name="robots" content="noindex" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Joseph Thomas Mansilla" />
    <meta property="og:title" content="Breakout — Joseph Thomas Mansilla" />
    <meta property="og:description" content="Breakout, un minijuego del portafolio de Joseph Thomas Mansilla, estudiante de Ingeniería en Sistemas en Buenos Aires." />
    <meta property="og:url" content="https://josephmansilla.github.io/juego.html" />
    <meta property="og:image" content="https://josephmansilla.github.io/assets/images/headshot.webp" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Breakout — Joseph Thomas Mansilla" />
    <meta name="twitter:description" content="Breakout, un minijuego del portafolio de Joseph Thomas Mansilla, estudiante de Ingeniería en Sistemas en Buenos Aires." />
    <meta name="twitter:image" content="https://josephmansilla.github.io/assets/images/headshot.webp" />
    <title>Breakout — Joseph Thomas Mansilla</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body data-page="game" data-i18n-title="meta.game" data-i18n-desc="meta.gameDesc">
    <a class="skip-link" href="#main" data-i18n="nav.skip">Saltar al contenido</a>
    <div id="site-header"></div>

    <main id="main" class="site-main">
      <section class="section">
        <div class="section-head reveal">
          <p class="kicker" data-i18n="game.kicker">Jugar</p>
          <h1 class="display">Breakout</h1>
          <p class="muted" data-i18n="game.intro">
            Destruí todos los ladrillos con la pelota. Mantenela en juego con la paleta.
          </p>
        </div>

        <div class="game-wrap reveal">
          <div class="game-hud">
            <p class="game-stat"><span data-i18n="game.score">Puntaje</span>: <span data-score>0</span></p>
            <p class="game-stat"><span data-i18n="game.lives">Vidas</span>: <span data-lives>3</span></p>
            <button class="btn" type="button" data-restart data-i18n="game.restart">Reiniciar</button>
          </div>
          <canvas
            class="game-canvas"
            id="breakout"
            width="800"
            height="600"
            data-i18n-aria="game.canvas"
            aria-label="Juego Breakout. Mové la paleta con las flechas, A y D, el mouse o el tacto."
          ></canvas>
          <p class="game-hint" data-i18n="game.hint">
            Teclado: flechas izquierda/derecha o A/D. Mouse y tacto: arrastrá sobre el tablero. El juego se pausa cuando esta pestaña está oculta.
          </p>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>

    <script src="js/analytics.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/shell.js?v=4"></script>
    <script src="js/main.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
