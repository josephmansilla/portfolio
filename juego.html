<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161616" />
    <meta name="description" content="Breakout mini-game from Joseph Thomas Mansilla's portfolio." />
    <title>JTM | Breakout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body data-page="game">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <main id="main" class="site-main">
      <section class="section">
        <div class="section-head reveal">
          <p class="kicker">Play</p>
          <h1 class="display">Breakout</h1>
          <p class="muted">
            Destroy every brick with the ball. Keep it alive with the paddle.
          </p>
        </div>

        <div class="game-wrap reveal">
          <div class="game-hud">
            <p class="game-stat">Score: <span data-score>0</span></p>
            <p class="game-stat">Lives: <span data-lives>3</span></p>
            <button class="btn" type="button" data-restart>Restart</button>
          </div>
          <canvas
            class="game-canvas"
            id="breakout"
            width="800"
            height="600"
            aria-label="Breakout game canvas. Move the paddle with the arrow keys, A and D, the mouse, or touch."
          ></canvas>
          <p class="game-hint">
            Keyboard: Left/Right arrows or A/D. Mouse and touch: drag across the
            canvas. The game pauses when this tab is hidden.
          </p>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>

    <script src="js/shell.js"></script>
    <script src="js/main.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
