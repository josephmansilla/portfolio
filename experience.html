<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161616" />
    <meta name="description" content="Education and work experience of Joseph Thomas Mansilla." />
    <title>JTM | Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body data-page="experience">
    <div id="particles" aria-hidden="true"></div>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <main id="main" class="site-main">
      <section class="section">
        <div class="section-head reveal">
          <p class="kicker">Path</p>
          <h1>Experience</h1>
        </div>

        <div class="experience-layout reveal">
          <div class="experience-side">
            <section class="experience-block" data-experience-block>
              <h2>Education</h2>
              <ol class="timeline" data-experience-list="education"></ol>
            </section>
            <section class="experience-block" data-experience-block hidden>
              <h2>Courses</h2>
              <ol class="timeline" data-experience-list="course"></ol>
            </section>
          </div>
          <section class="experience-block" data-experience-block>
            <h2>Work</h2>
            <ol class="timeline" data-experience-list="work"></ol>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/main.js"></script>
    <script src="js/experience.js"></script>
  </body>
</html>
