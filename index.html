<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="assets/images/jtm.ico" type="image/x-icon" />
    <meta
      name="description"
      content="Portfolio of Joseph Thomas Mansilla, Systems Engineering student in Buenos Aires."
    />
    <title>JTM | Dev Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body data-page="home" data-i18n-title="meta.home">
    <div id="particles" aria-hidden="true"></div>
    <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>

    <div id="site-header"></div>

    <main id="main" class="site-main">
      <section class="hero">
        <div class="hero-inner reveal">
          <p class="kicker place">
            <span class="icon-mask icon-pin" aria-hidden="true"></span>
            <span data-i18n="home.place">Buenos Aires, Argentina</span>
          </p>
          <h1>Joseph Thomas Mansilla</h1>
          <p class="lede" data-i18n="home.lede">Systems Engineering Student</p>
          <p class="bio" data-i18n="home.bio">
            Learning to become better.
          </p>
          <div class="hero-social" data-social="email github linkedin youtube twitter"></div>
          <div class="hero-actions">
            <a class="btn" href="projects.html" data-i18n="home.projects">Projects</a>
            <a class="btn btn-ghost" href="contact.html" data-i18n="home.contact">Contact</a>
            <a
              class="btn btn-ghost"
              data-resume
              download
              href="assets/cv/resume-Joseph-Mansilla-en.pdf"
              data-i18n-aria="home.resume"
              aria-label="Download resume"
            >
              <span class="icon-mask icon-resume" aria-hidden="true"></span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
