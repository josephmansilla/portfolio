<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="assets/images/jtm.ico" type="image/x-icon" />
    <meta name="description" content="Contact Joseph Thomas Mansilla." />
    <title>JTM | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body data-page="contact" data-i18n-title="meta.contact">
    <div id="particles" aria-hidden="true"></div>
    <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>
    <div id="site-header"></div>

    <main id="main" class="site-main">
      <section class="section">
        <div class="section-head reveal">
          <p class="kicker" data-i18n="contact.kicker">Hello</p>
          <h1 data-i18n="contact.title">Contact</h1>
          <p class="muted" data-i18n="contact.intro">
            Send a message through the form, or reach me directly.
          </p>
          <div class="contact-social" data-social="email github linkedin twitter discord"></div>
        </div>
        <form class="contact-form reveal" data-contact-form novalidate>
          <div class="field">
            <label for="name" data-i18n="contact.name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
            <p class="field-error" data-error-for="name"></p>
          </div>
          <div class="field">
            <label for="email" data-i18n="contact.email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
            <p class="field-error" data-error-for="email"></p>
          </div>
          <div class="field">
            <label for="message" data-i18n="contact.message">Message</label>
            <textarea id="message" name="message" required></textarea>
            <p class="field-error" data-error-for="message"></p>
          </div>
          <button class="btn" type="submit" data-i18n="contact.send">Send message</button>
          <p class="form-status" data-form-status role="status"></p>
        </form>
      </section>
    </main>
    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
