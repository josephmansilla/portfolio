<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161616" />
    <meta name="description" content="Contact Joseph Thomas Mansilla." />
    <title>Contact — Joseph Thomas Mansilla</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div id="particles" aria-hidden="true"></div>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="index.html">JTM</a>
        <div class="header-actions">
          <button
            class="nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-nav"
            data-nav-toggle
          >
            <span></span>
            <span></span>
            <span></span>
            <span class="visually-hidden">Menu</span>
          </button>
          <nav class="site-nav" id="site-nav" data-nav aria-label="Primary">
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="about.html">About</a></li>
              <li><a href="experience.html">Experience</a></li>
              <li><a href="projects.html">Projects</a></li>
              <li><a href="articles.html">Articles</a></li>
              <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <main id="main" class="site-main">
      <section class="section">
        <div class="section-head reveal">
          <p class="kicker">Hello</p>
          <h1>Contact</h1>
          <p class="muted">
            Send a message through the form, or reach me on GitHub and LinkedIn.
          </p>
        </div>
        <form class="contact-form reveal" data-contact-form novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
            <p class="field-error" data-error-for="name"></p>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
            <p class="field-error" data-error-for="email"></p>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
            <p class="field-error" data-error-for="message"></p>
          </div>
          <button class="btn" type="submit">Send message</button>
          <p class="form-status" data-form-status role="status"></p>
        </form>
        <div class="social-row">
          <a href="mailto:mansillajoseph@protonmail.com">mansillajoseph@protonmail.com</a>
          <a href="https://github.com/josephmansilla" rel="noopener noreferrer">GitHub</a>
          <a href="https://www.linkedin.com/in/josephthomansilla" rel="noopener noreferrer">LinkedIn</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p>© <span data-year></span> Joseph Thomas Mansilla</p>
        <div class="footer-links">
          <a href="index.html">Home</a>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
