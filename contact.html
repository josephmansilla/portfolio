    <meta property="og:image" content="https://josephmansilla.github.io/assets/images/headshot.webp" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Contacto — Joseph Thomas Mansilla" />
    <meta name="twitter:description" content="Contacto de Joseph Thomas Mansilla, estudiante de Ingeniería en Sistemas de Información en la UTN FRBA, Buenos Aires." />

    <title>Contacto — Joseph Thomas Mansilla</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body data-page="contact" data-i18n-title="meta.contact" data-i18n-desc="meta.contactDesc">
    <div id="particles" aria-hidden="true"></div>
    <a class="skip-link" href="#main" data-i18n="nav.skip">Saltar al contenido</a>
    <div id="site-header"></div>

    <main id="main" class="site-main">
      <section class="section">
        <div class="section-head reveal">
          <p class="kicker" data-i18n="contact.kicker">Hola</p>
          <h1 data-i18n="contact.title">Contacto</h1>
          <p class="muted" data-i18n="contact.intro">
            Envíame un mensaje con el formulario, o escribinme directo.
          </p>
          <div class="contact-social" data-social="email github linkedin twitter discord"></div>
        </div>
        <form class="contact-form reveal" data-contact-form novalidate>
          <div class="field">
            <label for="name" data-i18n="contact.name">Nombre</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
            <p class="field-error" data-error-for="name"></p>
          </div>
          <div class="field">
            <label for="email" data-i18n="contact.email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
            <p class="field-error" data-error-for="email"></p>
          </div>
          <div class="field">
            <label for="message" data-i18n="contact.message">Mensaje</label>
            <textarea id="message" name="message" required></textarea>
            <p class="field-error" data-error-for="message"></p>
          </div>
          <button class="btn" type="submit" data-i18n="contact.send">Enviar mensaje</button>
          <p class="form-status" data-form-status role="status"></p>
        </form>
      </section>
    </main>
    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/i18n.js?v=4"></script>
    <script src="js/shell.js?v=4"></script>
    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
