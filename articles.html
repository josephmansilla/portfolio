<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="assets/images/jtm.ico" type="image/x-icon" />
    <meta name="description" content="Writing by Joseph Thomas Mansilla." />
    <title>JTM | Articles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body data-page="articles" data-i18n-title="meta.articles">
    <div id="particles" aria-hidden="true"></div>
    <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>
    <div id="site-header"></div>

    <main id="main" class="site-main">
      <section class="section">
        <div class="section-head reveal">
          <p class="kicker" data-i18n="articles.kicker">Writing</p>
          <h1 data-i18n="articles.title">Articles</h1>
        </div>
        <div class="article-list reveal" data-article-list></div>
      </section>
    </main>
    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/main.js"></script>
    <script src="js/articles.js"></script>
  </body>
</html>
